<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris JS - SOLID Demo</title>


    <!-- =======================
         CSS: BOOTSTRAP + TAILWIND
         ======================= -->
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Tailwind (standalone, CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS específico del juego -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- =======================
         UI PRINCIPAL (HTML + BOOTSTRAP + TAILWIND)
         ======================= -->
    <main class="container mx-auto px-4">
      <div
        class="row justify-content-center items-center g-4 shadow-lg rounded-4 bg-slate-900/80 border border-slate-800/80 p-4"
      >
        <!-- Columna: Tablero -->
        <div class="col-md-7 flex flex-column items-center gap-3">
          <div id="board" aria-label="Tablero de Tetris"></div>

          <!-- Controles táctiles estilo maquinitas, justo debajo del tablero -->
          <section
            class="w-100 flex justify-center"
          >
            <div
              class="arcade-panel rounded-3xl border border-slate-600/70 px-4 py-3 flex flex-col gap-2 max-w-md"
            >
              <p class="text-[0.7rem] text-slate-300 uppercase tracking-[0.25em] text-center mb-1">
                Panel Arcade
              </p>
              <div class="flex justify-center gap-4 mb-2">
                <button
                  id="btn-mobile-rotate"
                  class="arcade-btn arcade-btn--yellow"
                >
                  ↻
                </button>
                <button
                  id="btn-mobile-hard"
                  class="arcade-btn arcade-btn--red"
                >
                  ⬇⬇
                </button>
              </div>
              <div class="flex justify-center gap-4">
                <button
                  id="btn-mobile-left"
                  class="arcade-btn arcade-btn--blue btn-control"
                >
                  ←
                </button>
                <button
                  id="btn-mobile-soft"
                  class="arcade-btn arcade-btn--green btn-control"
                >
                  ↓
                </button>
                <button
                  id="btn-mobile-right"
                  class="arcade-btn arcade-btn--blue btn-control"
                >
                  →
                </button>
              </div>
            </div>
          </section>
        </div>

        <!-- Columna: Panel lateral -->
        <div class="col-md-5">
          <div class="d-flex flex-column gap-3">
            <!-- Título -->
            <div>
              <h1 class="h3 text-sky-400 fw-semibold mb-1 text-center">Tetris</h1>
            </div>

            <!-- Controles principales -->
            <div
              class="rounded-3 border border-slate-700/80 bg-slate-900/80 p-3 d-flex flex-column gap-2"
            >
              <div class="d-flex gap-2 mb-2">
                <button
                  id="btn-start"
                  class="btn btn-success btn-sm flex-grow-1 fw-semibold"
                >
                  Iniciar / Reiniciar
                </button>
                <button
                  id="btn-pause"
                  class="btn btn-outline-light btn-sm flex-grow-1"
                >
                  Pausa
                </button>
              </div>
              <div class="d-flex justify-content-center">
                <button
                  id="btn-mute-toggle"
                  class="btn btn-secondary btn-sm px-4 rounded-full shadow-sm text-lg"
                  title="Silenciar/Activar sonido"
                >
                  🔊
                </button>
              </div>
              <p class="text-xs text-slate-400 mb-1 mt-2">
                Usa las flechas del teclado:
                <span class="font-mono">← →</span> mover,
                <span class="font-mono">↑</span> rotar,
                <span class="font-mono">↓</span> descenso rápido,
                <span class="font-mono">Espacio</span> caída instantánea.
              </p>
            </div>

            <!-- Estado -->
            <div
              class="rounded-3 border border-slate-700/80 bg-slate-900/80 p-3"
            >
              <div class="d-flex justify-content-between mb-1">
                <span class="text-slate-300 text-sm">Puntuación</span>
                <span id="score" class="font-mono fw-semibold text-sky-400"
                  >0</span
                >
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-slate-300 text-sm">Líneas</span>
                <span id="lines" class="font-mono fw-semibold text-emerald-400"
                  >0</span
                >
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-slate-300 text-sm">Mejor puntuación</span>
                <span
                  id="high-score"
                  class="font-mono fw-semibold text-fuchsia-300"
                  >0</span
                >
              </div>
              <div class="d-flex justify-content-between">
                <span class="text-slate-300 text-sm">Nivel</span>
                <span id="level" class="font-mono fw-semibold text-amber-300"
                  >1</span
                >
              </div>
            </div>

            <!-- Mensajes -->
            <div
              id="message"
              class="text-sm text-slate-300 fst-italic min-h-[2.4rem]"
            >
              Pulsa <span class="font-mono">Iniciar</span> para jugar.
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay visual de Game Over -->
      <div
        id="game-over-overlay"
        class="fixed inset-0 flex items-center justify-center bg-slate-950/80 backdrop-blur-xl opacity-0 pointer-events-none transition-opacity duration-300"
      >
        <div
          class="game-over-panel relative px-8 py-6 rounded-3xl border border-cyan-400/60 bg-slate-900/80 shadow-[0_0_40px_rgba(56,189,248,0.7)]"
        >
          <div
            class="absolute inset-0 rounded-3xl bg-gradient-to-br from-cyan-500/20 via-fuchsia-500/10 to-indigo-500/25 blur-3 opacity-70 pointer-events-none"
          ></div>
          <div class="relative text-center space-y-2">
            <h2
              class="game-over-title text-3xl md:text-4xl font-extrabold tracking-[0.25em] text-cyan-300 uppercase"
            >
              Game Over
            </h2>
            <p class="text-sm text-slate-200">
              Tu viaje galáctico ha terminado, piloto.
            </p>
            <p class="text-xs text-slate-400">
              Pulsa <span class="font-mono">Iniciar</span> o el botón de abajo
              para reiniciar.
            </p>
            <button
              id="btn-restart-overlay"
              class="mt-2 inline-flex items-center gap-2 px-6 py-2 rounded-full bg-cyan-400 text-slate-950 text-sm fw-semibold shadow-[0_0_20px_rgba(34,211,238,0.8)] hover:bg-cyan-300 transition-colors"
            >
              Reiniciar partida
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- =======================
         JS: PERSISTENCIA + LÓGICA DEL JUEGO (TETRIS)
         ======================= -->
    <script src="storage.js"></script>
    <script src="sound.js"></script>
    <script src="game.js"></script>
    <script src="game-ui.js"></script>
  </body>
</html>
